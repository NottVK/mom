<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Ti, Mamá ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@300;400&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Cormorant Garamond',serif;
  -webkit-tap-highlight-color:transparent;
  /* NO touch-action:manipulation aquí — lo manejamos por elemento */
}

/* ── CURSOR (desktop only) ── */
@media(hover:hover)and(pointer:fine){body{cursor:none;}#cursor,#cursor-ring{display:block;}}
@media(hover:none),(pointer:coarse){#cursor,#cursor-ring{display:none!important;}}

#cursor{
  position:fixed;width:10px;height:10px;
  background:rgba(255,255,255,.9);border-radius:50%;
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  box-shadow:0 0 12px 4px rgba(167,139,250,.6);
}
#cursor-ring{
  position:fixed;width:36px;height:36px;
  border:1px solid rgba(167,139,250,.4);border-radius:50%;
  pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);
  transition:transform .15s ease,width .3s,height .3s;
}

/* ── CANVASES ── */
#bg-canvas,#particle-canvas,#galaxy-canvas{position:fixed;inset:0;}
#bg-canvas{z-index:0;}
#particle-canvas{z-index:8;pointer-events:none;opacity:0;transition:opacity 2s ease;}
#galaxy-canvas{z-index:5;opacity:0;transition:opacity 2s ease;touch-action:none;}

/* ── FLASH ── */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;}

/* ── UI OVERLAY ── */
#ui{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;
}

/* ── INTRO ── */
#phase-intro{
  text-align:center;opacity:0;transition:opacity 2s ease;
  padding:0 clamp(1.2rem,6vw,3rem);
  width:100%;
}
#phase-intro.visible{opacity:1;}
#phase-intro h1{
  font-family:'Cinzel',serif;font-weight:300;
  font-size:clamp(.92rem,3.8vw,2rem);
  color:rgba(240,244,255,.9);
  letter-spacing:.1em;line-height:1.8;
  text-shadow:0 0 40px rgba(167,139,250,.8),0 0 80px rgba(167,139,250,.4);
  max-width:min(680px,90vw);
  margin:0 auto;
}
#tap-hint{
  margin-top:clamp(1.4rem,4vh,3rem);
  font-style:italic;font-size:clamp(.72rem,2.2vw,.95rem);
  color:rgba(167,139,250,.6);letter-spacing:.26em;
  animation:pulse 3s ease-in-out infinite;
}

/* ── MESSAGES ──
   Cada mensaje se posiciona absolutamente centrado en pantalla.
   Usamos position:fixed + transform para garantizar centrado real
   en cualquier dispositivo, sin depender del flujo del padre.
── */
.msg{
  position:fixed;
  /* centrado perfecto en X e Y */
  top:50%;left:50%;
  transform:translate(-50%, calc(-50% + 20px));
  width:90vw;
  max-width:min(740px,90vw);
  text-align:center;
  font-weight:300;
  font-size:clamp(1.05rem,4.5vw,2.8rem);
  color:rgba(240,244,255,.95);
  letter-spacing:.06em;line-height:1.6;
  opacity:0;
  /* sin transition aquí — GSAP lo maneja */
  text-shadow:0 0 30px rgba(167,139,250,.9),0 0 60px rgba(236,72,153,.4);
  padding:0 clamp(.8rem,4vw,2rem);
  pointer-events:none;
  z-index:10;
  /* evitar que el texto se parta raro en móvil */
  word-break:keep-all;
  overflow-wrap:break-word;
}
.msg.mama{
  font-size:clamp(2rem,10vw,5.5rem);
  font-style:italic;
  background:linear-gradient(135deg,#f0f4ff 0%,#c4b5fd 40%,#f9a8d4 70%,#f0f4ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 28px rgba(167,139,250,.8));
  text-shadow:none;
}

/* ── TAP CTA ── */
#tap-cta{
  position:fixed;bottom:clamp(18px,6vh,44px);
  left:50%;transform:translateX(-50%);
  z-index:20;font-family:'Cinzel',serif;
  font-size:clamp(.5rem,1.8vw,.68rem);
  letter-spacing:.28em;color:rgba(167,139,250,.5);
  text-transform:uppercase;opacity:0;
  transition:opacity .8s ease;
  animation:pulse 3s ease-in-out infinite;
  white-space:nowrap;padding:0 1rem;
  /* área táctil generosa en móvil */
  padding-top:12px;padding-bottom:12px;
}

/* ── GALAXY UI ── */
#galaxy-ui{
  position:fixed;inset:0;z-index:15;
  pointer-events:none;opacity:0;transition:opacity 2s ease;
}
#galaxy-hint{
  position:fixed;bottom:clamp(12px,3.5vh,28px);
  left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;
  font-size:clamp(.5rem,1.4vw,.62rem);
  letter-spacing:.28em;color:rgba(167,139,250,.4);
  text-transform:uppercase;
  animation:pulse 4s ease-in-out infinite;
  white-space:nowrap;pointer-events:none;
}

/* ── CONSTELLATION PHRASES ── */
.c-phrase{
  position:absolute;font-style:italic;font-weight:300;
  font-size:clamp(.58rem,1.4vw,.92rem);
  color:rgba(196,181,253,.8);
  text-shadow:0 0 18px rgba(167,139,250,.6);
  letter-spacing:.07em;
  animation:float-p 8s ease-in-out infinite;
  white-space:nowrap;max-width:32vw;
  overflow:hidden;text-overflow:ellipsis;
}
@media(max-width:600px){
  .c-phrase{font-size:.56rem;max-width:40vw;letter-spacing:.03em;}
  .c-phrase.hide-sm{display:none;}
}
@keyframes float-p{
  0%,100%{transform:translateY(0) rotate(var(--r,0deg));opacity:.55;}
  50%{transform:translateY(-10px) rotate(var(--r,0deg));opacity:.95;}
}

/* ── PHOTO FRAMES ── */
.photo-wrap{
  position:absolute;border-radius:50%;
  border:1.5px solid rgba(167,139,250,.45);
  box-shadow:0 0 16px rgba(167,139,250,.35),0 0 36px rgba(236,72,153,.18),inset 0 0 10px rgba(167,139,250,.1);
  overflow:hidden;
  animation:float-ph var(--d,7s) ease-in-out infinite;
  animation-delay:var(--dl,0s);
  background:rgba(10,5,30,.5);
  width:clamp(72px,8.5vw,128px);
  height:clamp(72px,8.5vw,128px);
}
@media(max-width:1024px)and(min-width:601px){
  .photo-wrap{width:clamp(68px,10vw,104px);height:clamp(68px,10vw,104px);}
}
@media(max-width:600px){
  .photo-wrap{width:60px;height:60px;}
}
.photo-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(.88) saturate(.8) contrast(1.05);
}
.photo-ph{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(107,33,168,.5),rgba(0,0,0,.7));
  font-size:1.5rem;
}
@keyframes float-ph{
  0%,100%{transform:translateY(0) scale(1);filter:brightness(.88);}
  50%{transform:translateY(-7px) scale(1.03);filter:brightness(1.05);}
}

/* ── STAR TOOLTIP ── */
#star-tooltip{
  position:fixed;z-index:30;
  background:rgba(10,5,30,.93);
  border:1px solid rgba(167,139,250,.3);border-radius:12px;
  padding:clamp(.65rem,2vw,1rem) clamp(.9rem,2.5vw,1.4rem);
  max-width:min(230px,78vw);text-align:center;
  color:rgba(240,244,255,.9);
  font-style:italic;font-size:clamp(.85rem,2.2vw,.95rem);
  line-height:1.5;letter-spacing:.05em;
  box-shadow:0 0 28px rgba(167,139,250,.3);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}

/* ── TAP OVERLAY — captura todos los toques en fases previas a galaxia ── */
#tap-overlay{
  position:fixed;inset:0;z-index:25;
  background:transparent;
  display:block;
  /* se oculta cuando ya no hace falta */
}

@keyframes pulse{0%,100%{opacity:.28;}50%{opacity:.85;}}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas>
<div id="flash"></div>

<!-- Overlay invisible que captura taps en móvil con máxima prioridad -->
<div id="tap-overlay"></div>

<div id="ui">
  <div id="phase-intro">
    <h1>Las estrellas se han alineado<br>para este día tan especial…</h1>
    <div id="tap-hint">toca para continuar</div>
  </div>
</div>

<!-- Mensajes fuera del #ui, position:fixed independientes -->
<div class="msg" id="msg1">Porque incluso el universo se queda pequeño…</div>
<div class="msg" id="msg2">para agradecer todo lo que has hecho por mí…</div>
<div class="msg mama" id="msg3">mamá ❤️</div>

<div id="tap-cta">toca para continuar</div>
<canvas id="galaxy-canvas"></canvas>
<div id="galaxy-ui"><div id="galaxy-hint">arrastra · gira · explora</div></div>
<div id="star-tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
/* ─────────────────────────────────
   HELPERS
───────────────────────────────── */
const W=()=>window.innerWidth;
const H=()=>window.innerHeight;
const isMob=()=>W()<=600;
const isTab=()=>W()>600&&W()<=1024;

/* ─────────────────────────────────
   CURSOR
───────────────────────────────── */
const $cursor=document.getElementById('cursor');
const $ring=document.getElementById('cursor-ring');
document.addEventListener('mousemove',e=>{
  $cursor.style.left=e.clientX+'px';$cursor.style.top=e.clientY+'px';
  $ring.style.left=e.clientX+'px';$ring.style.top=e.clientY+'px';
});

/* ─────────────────────────────────
   STATE
───────────────────────────────── */
let phase='intro', galaxyReady=false, canClick=false;
let lastTapTime=0; // anti-doble-tap

/* ─────────────────────────────────
   BG STARFIELD
───────────────────────────────── */
const bgC=document.getElementById('bg-canvas');
const bgX=bgC.getContext('2d');
let stars=[],travelSpeed=0,travelActive=false,lightBeam=null;
let nebulaAlpha=0,nebulaTime=0;

function resizeBg(){bgC.width=W();bgC.height=H();}
function initStars(){
  stars=[];
  const N=Math.min(1200,W()*H()/600);
  for(let i=0;i<N;i++) stars.push({
    x:Math.random()*W(),y:Math.random()*H(),z:Math.random()*W(),
    size:Math.random()*1.8+.3,brightness:Math.random(),
    tw:Math.random()*Math.PI*2,tws:.01+Math.random()*.03
  });
}

const nebulae=[
  {x:.18,y:.28,rx:.38,ry:.28,c1:'107,33,168',c2:'236,72,153',rot:-.3},
  {x:.76,y:.58,rx:.32,ry:.22,c1:'30,64,175',c2:'103,232,249',rot:.5},
  {x:.5,y:.88,rx:.42,ry:.16,c1:'88,28,135',c2:'249,168,212',rot:.1},
  {x:.08,y:.72,rx:.22,ry:.2,c1:'49,46,129',c2:'167,139,250',rot:-.8},
];

function drawNebulae(cx,cy){
  nebulaTime+=.0005;
  nebulae.forEach((nb,i)=>{
    const p=1+.05*Math.sin(nebulaTime*(1+i*.3));
    bgX.save();bgX.translate(nb.x*cx*2,nb.y*cy*2);bgX.rotate(nb.rot+nebulaTime*.1);
    const rx=nb.rx*cx*2*p,ry=nb.ry*cy*2*p;
    const g=bgX.createRadialGradient(0,0,0,0,0,Math.max(rx,ry));
    g.addColorStop(0,`rgba(${nb.c1},${nebulaAlpha*.2})`);
    g.addColorStop(.4,`rgba(${nb.c2},${nebulaAlpha*.12})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    bgX.scale(1,ry/rx);bgX.beginPath();bgX.arc(0,0,rx,0,Math.PI*2);
    bgX.fillStyle=g;bgX.fill();bgX.restore();
  });
}

function drawBg(dt){
  const w=W(),h=H(),cx=w/2,cy=h/2;
  bgX.clearRect(0,0,w,h);
  const g=bgX.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.8);
  if(phase==='messages'||phase==='galaxy'){
    g.addColorStop(0,'rgba(15,5,40,1)');g.addColorStop(.4,'rgba(8,2,25,1)');g.addColorStop(1,'rgba(0,0,0,1)');
  }else{g.addColorStop(0,'rgba(5,2,15,1)');g.addColorStop(1,'rgba(0,0,0,1)');}
  bgX.fillStyle=g;bgX.fillRect(0,0,w,h);

  stars.forEach(s=>{
    s.tw+=s.tws;const tw=.6+.4*Math.sin(s.tw);
    if(travelActive||travelSpeed>.1){
      s.z-=travelSpeed*dt*.5;if(s.z<=1)s.z=w;
      const sx=(s.x-cx)/s.z*w+cx,sy=(s.y-cy)/s.z*w+cy;
      const pz=s.z+travelSpeed*dt*.5;
      const px=(s.x-cx)/pz*w+cx,py=(s.y-cy)/pz*w+cy;
      const spd=Math.hypot(sx-px,sy-py),al=Math.min(1,tw*(.4+spd*.15));
      const sz=Math.max(.5,s.size*(1-s.z/w));
      bgX.beginPath();
      if(spd>2){bgX.strokeStyle=`rgba(200,210,255,${al})`;bgX.lineWidth=sz*.8;bgX.moveTo(px,py);bgX.lineTo(sx,sy);bgX.stroke();}
      else{bgX.arc(sx,sy,sz,0,Math.PI*2);bgX.fillStyle=`rgba(200,210,255,${al})`;bgX.fill();}
    }else{
      bgX.beginPath();bgX.arc(s.x,s.y,s.size*tw,0,Math.PI*2);
      bgX.fillStyle=`rgba(200,210,255,${tw*(.3+s.brightness*.7)})`;bgX.fill();
    }
  });

  if(lightBeam){
    lightBeam.p=Math.min(1,lightBeam.p+dt*.00035);
    const sz=lightBeam.p*Math.max(w,h)*.14,al=lightBeam.p*.9;
    const gd=bgX.createRadialGradient(cx,cy,0,cx,cy,sz);
    gd.addColorStop(0,`rgba(255,255,255,${al})`);
    gd.addColorStop(.2,`rgba(180,160,255,${al*.8})`);
    gd.addColorStop(.5,`rgba(100,80,200,${al*.3})`);
    gd.addColorStop(1,'rgba(0,0,0,0)');
    bgX.fillStyle=gd;bgX.fillRect(0,0,w,h);
    if(lightBeam.p>=1){triggerExplosion();lightBeam=null;}
  }

  if((phase==='messages'||phase==='galaxy')&&nebulaAlpha>0) drawNebulae(cx,cy);
}

/* ─────────────────────────────────
   PARTICLES
───────────────────────────────── */
const pC=document.getElementById('particle-canvas');
const pX=pC.getContext('2d');
let particles=[];
function resizeP(){pC.width=W();pC.height=H();}

function spawnP(x,y,n,expl=false){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=expl?(2+Math.random()*8):(.3+Math.random()*2);
    const hue=[270,300,210,180][Math.floor(Math.random()*4)];
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
      decay:expl?(.008+Math.random()*.015):(.003+Math.random()*.008),
      size:expl?(1+Math.random()*3):(.5+Math.random()*2),
      hue,sat:60+Math.random()*40,grav:expl?.05:-.01});
  }
}

function updateP(dt){
  pX.clearRect(0,0,pC.width,pC.height);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt*.05;p.y+=p.vy*dt*.05;p.vy+=p.grav;p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    pX.beginPath();pX.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    pX.fillStyle=`hsla(${p.hue},${p.sat}%,75%,${p.life*.9})`;
    pX.shadowBlur=8;pX.shadowColor=`hsla(${p.hue},${p.sat}%,75%,${p.life})`;
    pX.fill();pX.shadowBlur=0;
  }
  if((phase==='messages'||phase==='galaxy')&&Math.random()<.1){
    const hue=[270,300,210][Math.floor(Math.random()*3)];
    particles.push({x:Math.random()*pC.width,y:Math.random()*pC.height,
      vx:(Math.random()-.5)*.5,vy:-(0.2+Math.random()*.6),life:.8+Math.random()*.2,
      decay:.002+Math.random()*.004,size:.5+Math.random()*1.5,hue,sat:70+Math.random()*30,grav:-.002});
  }
}

/* ─────────────────────────────────
   EXPLOSION
───────────────────────────────── */
const $flash=document.getElementById('flash');
function triggerExplosion(){
  phase='exploding';
  spawnP(W()/2,H()/2,300,true);
  gsap.to($flash,{opacity:1,duration:.22,ease:'power2.in',onComplete:()=>{
    gsap.to($flash,{opacity:0,duration:1.6,ease:'power2.out',onComplete:revealUniverse});
  }});
}
function revealUniverse(){
  phase='messages';travelActive=false;travelSpeed=0;
  gsap.to({v:0},{v:1,duration:3,ease:'power2.out',onUpdate:function(){nebulaAlpha=this.targets()[0].v;}});
  pC.style.opacity=1;
  setTimeout(showMsg,1500);
}

/* ─────────────────────────────────
   MESSAGES
   Cada .msg es position:fixed centrado.
   GSAP anima opacity y translateY directamente.
───────────────────────────────── */
const msgs=[
  document.getElementById('msg1'),
  document.getElementById('msg2'),
  document.getElementById('msg3')
];
let curMsg=-1;

function showMsg(){
  // Ocultar el anterior con GSAP
  if(curMsg>=0&&msgs[curMsg]){
    const old=msgs[curMsg];
    gsap.to(old,{
      opacity:0,
      y:'-=24',       // sube un poco al salir
      duration:.9,
      ease:'power2.in',
      onComplete:()=>{
        gsap.set(old,{y:0}); // reset para no acumular
      }
    });
  }

  curMsg++;

  if(curMsg>=msgs.length){
    // Ocultar tap-overlay antes de lanzar galaxia
    document.getElementById('tap-overlay').style.display='none';
    setTimeout(launchGalaxy,800);
    return;
  }

  const msg=msgs[curMsg];
  // Partimos desde opacity 0 + desplazamiento hacia abajo
  gsap.set(msg,{opacity:0,y:22});
  // Animamos entrada
  gsap.to(msg,{opacity:1,y:0,duration:1.1,ease:'power2.out'});

  // Partículas decorativas
  setTimeout(()=>spawnP(W()/2,H()/2,55,false),250);

  canClick=true;
  const cta=document.getElementById('tap-cta');
  gsap.to(cta,{opacity:1,duration:.6,ease:'power2.out'});
  cta.textContent=curMsg===msgs.length-1?'toca para explorar el universo':'toca para continuar';
}

/* ─────────────────────────────────
   LAUNCH GALAXY
───────────────────────────────── */
function launchGalaxy(){
  phase='galaxy';canClick=false;
  gsap.to(document.getElementById('tap-cta'),{opacity:0,duration:.4});
  const ui=document.getElementById('ui');
  gsap.to(ui,{opacity:0,duration:1.5,onComplete:()=>{ui.style.display='none';}});
  // Ocultar mensajes restantes
  msgs.forEach(m=>gsap.to(m,{opacity:0,duration:1}));
  setTimeout(buildGalaxy,1600);
}

/* ─────────────────────────────────
   THREE.JS GALAXY
───────────────────────────────── */
let renderer,scene,camera,galaxyMesh,galaxyGroup;
let isDrag=false,lastX=0,lastY=0,velX=0,velY=0,specialStars=[];

const starMsgs=[
  "Gracias por cuidarme.",
  "Eres mi lugar seguro.",
  "Tu amor ilumina mi universo.",
  "Siempre serás mi estrella favorita.",
  "Te quiero hasta las estrellas y más allá.",
  "Mi primer hogar fuiste tú.",
  "Feliz Día de la Madre. ❤️",
  "Tu abrazo es mi hogar.",
  "Mamá, eres mi heroína.",
  "Gracias por cada sacrificio.",
  "Tu amor no tiene límites.",
  "Eres la razón de mi sonrisa.",
];

function buildGalaxy(){
  const gc=document.getElementById('galaxy-canvas');
  renderer=new THREE.WebGLRenderer({canvas:gc,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(W(),H());
  renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(60,W()/H(),.1,1000);
  camera.position.set(0,28,55);camera.lookAt(0,0,0);
  galaxyGroup=new THREE.Group();scene.add(galaxyGroup);

  const N=28000,pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N);
  const iC=new THREE.Color('#a78bfa'),oC=new THREE.Color('#1e3a5f'),aC=new THREE.Color('#f9a8d4');
  for(let i=0;i<N;i++){
    const r=Math.random()*22;
    const br=(((i%5)/5)*Math.PI*2)+r*1.6;
    const rx=(Math.pow(Math.random(),2.5)*(Math.random()<.5?1:-1)*.55*r);
    const ry=(Math.pow(Math.random(),2.5)*(Math.random()<.5?1:-1)*.55*r*.3);
    const rz=(Math.pow(Math.random(),2.5)*(Math.random()<.5?1:-1)*.55*r);
    pos[i*3]=Math.cos(br)*r+rx;pos[i*3+1]=ry;pos[i*3+2]=Math.sin(br)*r+rz;
    const c=new THREE.Color();c.lerpColors(iC,oC,r/22);
    if(Math.random()<.2)c.lerp(aC,.4);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;sz[i]=Math.random()*2.5+.5;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(sz,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uPR:{value:renderer.getPixelRatio()}},
    vertexShader:`attribute float size;varying vec3 vC;uniform float uT,uPR;
      void main(){vC=color;vec3 p=position;p.y+=sin(uT*.3+p.x*.5)*.03;
      vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=size*uPR*(30./-mv.z);
      gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;void main(){vec2 uv=gl_PointCoord-.5;
      float d=length(uv);if(d>.5)discard;
      float a=(1.-smoothstep(0.,.5,d))*1.2;gl_FragColor=vec4(vC*1.3,a);}`,
    vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
  });
  galaxyMesh=new THREE.Points(geo,mat);galaxyGroup.add(galaxyMesh);

  galaxyGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32),
    new THREE.MeshBasicMaterial({color:0xc4b5fd,transparent:true,opacity:.6})));
  const cm=new THREE.ShaderMaterial({
    uniforms:{uCol:{value:new THREE.Color(0xa78bfa)}},
    vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vN;uniform vec3 uCol;void main(){float d=1.-dot(vN,vec3(0,0,1));float a=pow(d,2.5)*.8;gl_FragColor=vec4(uCol,a);}`,
    transparent:true,depthWrite:false,side:THREE.FrontSide,blending:THREE.AdditiveBlending
  });
  galaxyGroup.add(new THREE.Mesh(new THREE.SphereGeometry(2.5,32,32),cm));

  starMsgs.forEach((msg,i)=>{
    const angle=(i/starMsgs.length)*Math.PI*2,dist=13+Math.random()*10;
    const star=new THREE.Mesh(new THREE.SphereGeometry(.35,16,16),
      new THREE.MeshBasicMaterial({color:0xfce7f3}));
    star.position.set(Math.cos(angle)*dist,(Math.random()-.5)*5,Math.sin(angle)*dist);
    star.userData={msg,index:i,baseY:star.position.y};
    star.add(new THREE.Mesh(new THREE.RingGeometry(.5,.7,32),
      new THREE.MeshBasicMaterial({color:0xf9a8d4,transparent:true,opacity:.5,side:THREE.DoubleSide})));
    galaxyGroup.add(star);specialStars.push(star);
  });

  const dN=5000,dp=new Float32Array(dN*3),dc=new Float32Array(dN*3);
  for(let i=0;i<dN;i++){
    const a=Math.random()*Math.PI*2,r=5+Math.random()*20,t=Math.random();
    dp[i*3]=Math.cos(a)*r+(Math.random()-.5)*3;dp[i*3+1]=(Math.random()-.5)*1.5;dp[i*3+2]=Math.sin(a)*r+(Math.random()-.5)*3;
    dc[i*3]=.4+t*.3;dc[i*3+1]=.2+t*.2;dc[i*3+2]=.6+t*.3;
  }
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
  dg.setAttribute('color',new THREE.BufferAttribute(dc,3));
  galaxyGroup.add(new THREE.Points(dg,new THREE.PointsMaterial(
    {size:.08,vertexColors:true,transparent:true,opacity:.4,blending:THREE.AdditiveBlending})));

  gc.style.opacity='1';
  document.getElementById('galaxy-ui').style.opacity='1';
  buildPhotos();
  buildPhrases();
  setupInteraction();
  galaxyReady=true;
  gsap.from(camera.position,{z:120,y:60,duration:4,ease:'power3.out'});
}

/* ─────────────────────────────────
   PHOTOS
───────────────────────────────── */
function buildPhotos(){
  const fotos=['img/foto1.jpeg','img/foto2.jpeg','img/foto3.jpeg'];
  const layout=[
    {d:{top:'13%',left:'2.5%'},t:{top:'11%',left:'2%'},m:{top:'9%',left:'2%'}},
    {d:{top:'44%',right:'2.5%'},t:{top:'41%',right:'2%'},m:{top:'43%',right:'2%'}},
    {d:{bottom:'13%',left:'2.5%'},t:{bottom:'11%',left:'2%'},m:{bottom:'12%',left:'2%'}},
  ];
  const durs=['7s','9s','6.5s'],dels=['0s','2s','3.5s'],icons=['🌟','💜','🌸'];
  const ui=document.getElementById('galaxy-ui');
  fotos.forEach((src,i)=>{
    const key=isMob()?'m':isTab()?'t':'d';
    const pos=layout[i][key];
    const wrap=document.createElement('div');
    wrap.className='photo-wrap';
    wrap.style.setProperty('--d',durs[i]);
    wrap.style.setProperty('--dl',dels[i]);
    Object.entries(pos).forEach(([k,v])=>wrap.style[k]=v);
    const img=document.createElement('img');
    img.src=src;img.alt='foto familiar';
    img.onerror=()=>{
      img.remove();
      const ph=document.createElement('div');ph.className='photo-ph';ph.textContent=icons[i];
      wrap.appendChild(ph);
    };
    wrap.appendChild(img);
    ui.appendChild(wrap);
  });
}

/* ─────────────────────────────────
   PHRASES
───────────────────────────────── */
function buildPhrases(){
  const all=[
    {t:"Gracias por cuidarme.",      p:{top:'7%',left:'5%'},        r:'-3deg',sm:false},
    {t:"Feliz Día, Mamá. ❤️",        p:{top:'20%',right:'5%'},      r:'3.5deg',sm:true},
    {t:"Eres mi lugar seguro.",       p:{top:'55%',left:'4%'},       r:'2deg',  sm:true},
    {t:"Tu amor no tiene límites.",   p:{bottom:'22%',right:'4%'},   r:'-4deg', sm:false},
    {t:"Te quiero infinitamente.",    p:{bottom:'10%',left:'4%'},    r:'3deg',  sm:true},
    {t:"Mi héroe favorito eres tú.",  p:{top:'78%',right:'4%'},      r:'-2deg', sm:true},
  ];
  const ui=document.getElementById('galaxy-ui');
  all.forEach((item,i)=>{
    const el=document.createElement('div');
    el.className='c-phrase'+(item.sm?' hide-sm':'');
    el.textContent=item.t;
    el.style.setProperty('--r',item.r);
    Object.entries(item.p).forEach(([k,v])=>el.style[k]=v);
    el.style.animationDelay=(i*1.4)+'s';
    ui.appendChild(el);
  });
}

/* ─────────────────────────────────
   GALAXY INTERACTION
───────────────────────────────── */
function setupInteraction(){
  const gc=document.getElementById('galaxy-canvas');
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
  const tip=document.getElementById('star-tooltip');
  let zT=camera.position.z,td=0,dragged=false;

  const onDown=(x,y)=>{isDrag=true;lastX=x;lastY=y;velX=0;velY=0;dragged=false;};
  const onMove=(x,y)=>{
    if(!isDrag)return;dragged=true;
    velX=(y-lastY)*.003;velY=(x-lastX)*.003;
    galaxyGroup.rotation.x+=velX;galaxyGroup.rotation.y+=velY;
    lastX=x;lastY=y;
  };
  const onUp=()=>{isDrag=false;};

  gc.addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));
  gc.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
  gc.addEventListener('mouseup',onUp);

  gc.addEventListener('touchstart',e=>{
    if(e.touches.length===1)onDown(e.touches[0].clientX,e.touches[0].clientY);
    if(e.touches.length===2)td=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    e.preventDefault();
  },{passive:false});
  gc.addEventListener('touchmove',e=>{
    if(e.touches.length===1)onMove(e.touches[0].clientX,e.touches[0].clientY);
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      zT=Math.max(18,Math.min(85,zT*(td/d)));td=d;
    }
    e.preventDefault();
  },{passive:false});
  gc.addEventListener('touchend',e=>{
    onUp();
    if(!dragged&&e.changedTouches.length===1)hitTest(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  });
  gc.addEventListener('wheel',e=>{zT=Math.max(18,Math.min(85,camera.position.z+e.deltaY*.05));e.preventDefault();},{passive:false});
  gc.addEventListener('click',e=>{if(!dragged)hitTest(e.clientX,e.clientY);});

  function hitTest(cx,cy){
    mouse.x=(cx/W())*2-1;mouse.y=-(cy/H())*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(specialStars,true);
    if(hits.length){
      let obj=hits[0].object;
      while(obj&&!obj.userData.msg)obj=obj.parent;
      if(obj?.userData.msg){
        tip.textContent=obj.userData.msg;
        if(isMob()){tip.style.left='50%';tip.style.top='16%';tip.style.transform='translateX(-50%)';}
        else{tip.style.left=(cx+16)+'px';tip.style.top=(cy-18)+'px';tip.style.transform='none';}
        tip.style.opacity='1';
        spawnP(cx,cy,30,false);
        setTimeout(()=>tip.style.opacity='0',3500);
      }
    }
  }
  window._zT=()=>zT;
}

/* ─────────────────────────────────
   ANIMATION LOOP
───────────────────────────────── */
let lt=0,t=0;
function animate(ts){
  requestAnimationFrame(animate);
  const dt=Math.min(ts-lt,50);lt=ts;t+=dt;
  drawBg(dt);updateP(dt);
  if(!travelActive&&travelSpeed>0)travelSpeed=Math.max(0,travelSpeed-dt*.0002);
  if(galaxyReady&&renderer){
    if(!isDrag){galaxyGroup.rotation.y+=.0008;velX*=.95;velY*=.95;}
    specialStars.forEach((s,i)=>{
      s.position.y=s.userData.baseY+Math.sin(t*.001+i)*.3;
      s.children[0].rotation.z+=.01;
    });
    if(galaxyMesh)galaxyMesh.material.uniforms.uT.value=t*.001;
    if(window._zT)camera.position.z+=(window._zT()-camera.position.z)*.05;
    renderer.render(scene,camera);
  }
}

/* ─────────────────────────────────
   INTRO
───────────────────────────────── */
function startIntro(){
  setTimeout(()=>{
    document.getElementById('phase-intro').classList.add('visible');
    setTimeout(()=>{canClick=true;},2000);
  },1500);
}

/* ─────────────────────────────────
   TAP HANDLER — máxima velocidad en móvil
   Usamos touchstart en el tap-overlay (passive:true = sin bloqueo)
   para respuesta INMEDIATA. El overlay está en z-index:25,
   por encima de todo excepto el tooltip de galaxia.
───────────────────────────────── */
const $overlay=document.getElementById('tap-overlay');

function processInteraction(x,y){
  // Anti-doble-disparo: ignorar si menos de 300ms desde el último tap
  const now=Date.now();
  if(now-lastTapTime<300)return;
  lastTapTime=now;

  if(phase!=='galaxy')spawnP(x,y,18,false);
  if(!canClick)return;
  canClick=false;

  if(phase==='intro'){
    phase='traveling';
    const pi=document.getElementById('phase-intro');
    gsap.to(pi,{opacity:0,duration:1.2});
    travelActive=true;
    gsap.to({s:0},{s:18,duration:3.5,ease:'power2.in',onUpdate:function(){travelSpeed=this.targets()[0].s;}});
    setTimeout(()=>{travelActive=false;lightBeam={p:0};},3200);

  }else if(phase==='messages'){
    // Ocultar CTA inmediatamente
    gsap.to(document.getElementById('tap-cta'),{opacity:0,duration:.3});
    showMsg();
  }
}

// touchstart passive:true → respuesta inmediata sin bloquear scroll
$overlay.addEventListener('touchstart',e=>{
  if(phase==='galaxy'){$overlay.style.display='none';return;}
  const t=e.touches[0];
  processInteraction(t.clientX,t.clientY);
},{passive:true});

// click para desktop (mouse)
$overlay.addEventListener('click',e=>{
  if(phase==='galaxy'){$overlay.style.display='none';return;}
  processInteraction(e.clientX,e.clientY);
});

/* ─────────────────────────────────
   RESIZE
───────────────────────────────── */
window.addEventListener('resize',()=>{
  resizeBg();resizeP();
  if(renderer){renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix();}
});

/* ─────────────────────────────────
   INIT
───────────────────────────────── */
resizeBg();resizeP();initStars();startIntro();requestAnimationFrame(animate);
</script>
