<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Ti, Mamá ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --nebula-purple: #6b21a8;
    --nebula-pink: #ec4899;
    --nebula-blue: #1e40af;
    --star-white: #f0f4ff;
    --glow-cyan: #67e8f9;
  }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    cursor: none;

    touch-action: manipulation;
-webkit-tap-highlight-color: transparent;
  }

  #cursor {
    position: fixed;
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 12px 4px rgba(167,139,250,0.6);
    transition: transform 0.1s ease;
  }

  #cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid rgba(167,139,250,0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.15s ease, width 0.3s, height 0.3s;
  }

  /* ── CANVAS ── */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── OVERLAY UI ── */
  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  /* ── PHASE: INTRO ── */
  #phase-intro {
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
  }

  #phase-intro.visible { opacity: 1; }

  #phase-intro h1 {
    font-family: 'Cinzel', serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 3vw, 2rem);
    color: rgba(240,244,255,0.9);
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(167,139,250,0.8), 0 0 80px rgba(167,139,250,0.4);
    line-height: 1.6;
    max-width: 700px;
    padding: 0 2rem;
  }

  #tap-hint {
    margin-top: 3rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    color: rgba(167,139,250,0.6);
    letter-spacing: 0.3em;
    animation: pulse-hint 3s ease-in-out infinite;
  }

  @keyframes pulse-hint {
    0%,100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* ── FLASH ── */
  #flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }

  /* ── MESSAGES ── */
  #messages {
    text-align: center;
    pointer-events: none;
    position: absolute;
  }

  .msg {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.4rem, 4vw, 3rem);
    color: rgba(240,244,255,0.95);
    letter-spacing: 0.06em;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.5s ease, transform 1.5s ease;
    text-shadow:
      0 0 30px rgba(167,139,250,0.9),
      0 0 60px rgba(236,72,153,0.4),
      0 0 100px rgba(103,232,249,0.2);
    padding: 0 2rem;
    max-width: 80vw;
  }

  .msg.active {
    opacity: 1;
    transform: translateY(0);
  }

  .msg.mama {
    font-size: clamp(2.5rem, 8vw, 6rem);
    font-style: italic;
    background: linear-gradient(135deg, #f0f4ff 0%, #c4b5fd 40%, #f9a8d4 70%, #f0f4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(167,139,250,0.8));
    text-shadow: none;
  }

  /* ── TAP CTA ── */
  #tap-cta {
    position: fixed;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: rgba(167,139,250,0.5);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1s ease;
    animation: pulse-hint 3s ease-in-out infinite;
    white-space: nowrap;
  }

  /* ── GALAXY PHASE ── */
  #galaxy-canvas {
    position: fixed;
    inset: 0;
    z-index: 5;
    opacity: 0;
    transition: opacity 2s ease;
    cursor: grab;
  }

  #galaxy-canvas:active { cursor: grabbing; }

  #galaxy-ui {
    position: fixed;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .constellation-phrase {
    position: absolute;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(0.75rem, 1.5vw, 1.1rem);
    color: rgba(196,181,253,0.8);
    text-shadow: 0 0 20px rgba(167,139,250,0.6);
    letter-spacing: 0.1em;
    animation: float-phrase 8s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes float-phrase {
    0%,100% { transform: translateY(0) rotate(var(--rot)); opacity: 0.6; }
    50% { transform: translateY(-12px) rotate(var(--rot)); opacity: 1; }
  }

  #galaxy-hint {
    position: fixed;
    bottom: 6vh;
    left: 50%; transform: translateX(-50%);
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: rgba(167,139,250,0.4);
    text-transform: uppercase;
    animation: pulse-hint 4s ease-in-out infinite;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── STAR TOOLTIP ── */
  #star-tooltip {
    position: fixed;
    z-index: 30;
    background: rgba(10,5,30,0.92);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    max-width: 240px;
    text-align: center;
    color: rgba(240,244,255,0.9);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-style: italic;
    line-height: 1.5;
    letter-spacing: 0.05em;
    box-shadow: 0 0 30px rgba(167,139,250,0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    backdrop-filter: blur(8px);
  }

  /* ── PARTICLE CANVAS ── */
  #particle-canvas {
    position: fixed;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }

  @media (hover: none) and (pointer: coarse) {
  #cursor,
  #cursor-ring {
    display: none;
  }

  html, body {
    cursor: auto;
  }
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<!-- Background starfield -->
<canvas id="bg-canvas"></canvas>

<!-- Particle overlay -->
<canvas id="particle-canvas"></canvas>

<!-- Flash effect -->
<div id="flash"></div>

<!-- UI overlay -->
<div id="ui">
  <div id="phase-intro">
    <h1>Las estrellas se han alineado<br>para este día tan especial…</h1>
    <div id="tap-hint">toca para continuar</div>
  </div>
  <div id="messages">
    <div class="msg" id="msg1">Porque incluso el universo se queda pequeño…</div>
    <div class="msg" id="msg2">para agradecer todo lo que has hecho por mí…</div>
    <div class="msg mama" id="msg3">mamá ❤️</div>
  </div>
</div>

<!-- Tap CTA between phases -->
<div id="tap-cta">toca para continuar</div>

<!-- Galaxy -->
<canvas id="galaxy-canvas"></canvas>

<!-- Galaxy UI overlay -->
<div id="galaxy-ui">
  <div id="galaxy-hint">arrastra · gira · explora</div>
</div>

<!-- Star tooltip -->
<div id="star-tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
// ─────────────────────────────────────────────
// CURSOR
// ─────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mx = -100, my = -100;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top = my + 'px';
  cursorRing.style.left = mx + 'px';
  cursorRing.style.top = my + 'px';
});

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let phase = 'intro'; // intro → traveling → revealing → messages → galaxy
let msgIndex = 0;
let galaxyReady = false;
let canClick = false;

// ─────────────────────────────────────────────
// BACKGROUND STARFIELD (2D canvas)
// ─────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];
let travelSpeed = 0;
let travelActive = false;
let lightBeam = null;
let lightIntensity = 0;
let explosionAlpha = 0;
let explosionActive = false;

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}

function initStars() {
  stars = [];
  const N = Math.min(1200, window.innerWidth * window.innerHeight / 600);
  for (let i = 0; i < N; i++) {
    stars.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      z: Math.random() * bgCanvas.width,
      prevX: 0, prevY: 0,
      size: Math.random() * 1.8 + 0.3,
      brightness: Math.random(),
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.01 + Math.random() * 0.03
    });
  }
}

function drawBg(dt) {
  const W = bgCanvas.width, H = bgCanvas.height;
  bgCtx.clearRect(0, 0, W, H);

  // Deep space gradient
  const grad = bgCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.8);
  if (phase === 'galaxy' || phase === 'messages') {
    grad.addColorStop(0, 'rgba(15,5,40,1)');
    grad.addColorStop(0.4, 'rgba(8,2,25,1)');
    grad.addColorStop(1, 'rgba(0,0,0,1)');
  } else {
    grad.addColorStop(0, 'rgba(5,2,15,1)');
    grad.addColorStop(1, 'rgba(0,0,0,1)');
  }
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);

  const cx = W/2, cy = H/2;

  stars.forEach(s => {
    s.twinkle += s.twinkleSpeed;
    const twink = 0.6 + 0.4 * Math.sin(s.twinkle);

    if (travelActive || travelSpeed > 0.1) {
      s.z -= travelSpeed * dt * 0.5;
      if (s.z <= 1) s.z = bgCanvas.width;

      const sx = (s.x - cx) / s.z * bgCanvas.width + cx;
      const sy = (s.y - cy) / s.z * bgCanvas.width + cy;
      const prevSx = (s.x - cx) / (s.z + travelSpeed * dt * 0.5) * bgCanvas.width + cx;
      const prevSy = (s.y - cy) / (s.z + travelSpeed * dt * 0.5) * bgCanvas.width + cy;

      const spd = Math.hypot(sx - prevSx, sy - prevSy);
      const alpha = Math.min(1, twink * (0.4 + spd * 0.15));
      const size = Math.max(0.5, s.size * (1 - s.z / bgCanvas.width));

      bgCtx.beginPath();
      if (spd > 2) {
        bgCtx.strokeStyle = `rgba(200,210,255,${alpha})`;
        bgCtx.lineWidth = size * 0.8;
        bgCtx.moveTo(prevSx, prevSy);
        bgCtx.lineTo(sx, sy);
        bgCtx.stroke();
      } else {
        bgCtx.arc(sx, sy, size, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(200,210,255,${alpha})`;
        bgCtx.fill();
      }
    } else {
      const alpha = twink * (0.3 + s.brightness * 0.7);
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.size * twink, 0, Math.PI * 2);
      bgCtx.fillStyle = `rgba(200,210,255,${alpha})`;
      bgCtx.fill();
    }
  });

  // Light beam approaching
  if (lightBeam) {
    lightIntensity += dt * 0.0008;
    lightBeam.progress = Math.min(1, lightBeam.progress + dt * 0.0003);
    const size = lightBeam.progress * Math.max(W, H) * 0.12;
    const alpha = lightBeam.progress * 0.9;
    const grd = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, size);
    grd.addColorStop(0, `rgba(255,255,255,${alpha})`);
    grd.addColorStop(0.2, `rgba(180,160,255,${alpha * 0.8})`);
    grd.addColorStop(0.5, `rgba(100,80,200,${alpha * 0.3})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = grd;
    bgCtx.fillRect(0, 0, W, H);

    if (lightBeam.progress >= 1) {
      triggerExplosion();
      lightBeam = null;
    }
  }

  // Nebula clouds (post-explosion)
  if ((phase === 'messages' || phase === 'galaxy') && nebulaAlpha > 0) {
    drawNebulae(bgCtx, W, H);
  }
}

// ─────────────────────────────────────────────
// NEBULAE
// ─────────────────────────────────────────────
let nebulaAlpha = 0;
const nebulae = [
  { x: 0.2, y: 0.3, rx: 0.35, ry: 0.25, color1: '107,33,168', color2: '236,72,153', rot: -0.3 },
  { x: 0.75, y: 0.6, rx: 0.3, ry: 0.2, color1: '30,64,175', color2: '103,232,249', rot: 0.5 },
  { x: 0.5, y: 0.85, rx: 0.4, ry: 0.15, color1: '88,28,135', color2: '249,168,212', rot: 0.1 },
  { x: 0.1, y: 0.75, rx: 0.2, ry: 0.18, color1: '49,46,129', color2: '167,139,250', rot: -0.8 },
];
let nebulaTime = 0;

function drawNebulae(ctx, W, H) {
  nebulaTime += 0.0005;
  nebulae.forEach((nb, i) => {
    const pulse = 1 + 0.05 * Math.sin(nebulaTime * (1 + i * 0.3));
    const x = nb.x * W, y = nb.y * H;
    const rx = nb.rx * W * pulse, ry = nb.ry * H * pulse;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(nb.rot + nebulaTime * 0.1);
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx, ry));
    grd.addColorStop(0, `rgba(${nb.color1},${nebulaAlpha * 0.2})`);
    grd.addColorStop(0.4, `rgba(${nb.color2},${nebulaAlpha * 0.12})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.scale(1, ry / rx);
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.restore();
  });
}

// ─────────────────────────────────────────────
// PARTICLE SYSTEM
// ─────────────────────────────────────────────
const pCanvas = document.getElementById('particle-canvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];
let particleActive = false;

function resizeP() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}

function spawnParticles(x, y, count, explosive = false) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = explosive
      ? (2 + Math.random() * 8)
      : (0.3 + Math.random() * 2);
    const hue = [270, 300, 210, 180][Math.floor(Math.random() * 4)];
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: explosive ? (0.008 + Math.random() * 0.015) : (0.003 + Math.random() * 0.008),
      size: explosive ? (1 + Math.random() * 3) : (0.5 + Math.random() * 2),
      hue,
      sat: 60 + Math.random() * 40,
      grav: explosive ? 0.05 : -0.01
    });
  }
}

function updateParticles(dt) {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 0.05;
    p.y += p.vy * dt * 0.05;
    p.vy += p.grav;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    pCtx.fillStyle = `hsla(${p.hue},${p.sat}%,75%,${p.life * 0.9})`;
    pCtx.shadowBlur = 8;
    pCtx.shadowColor = `hsla(${p.hue},${p.sat}%,75%,${p.life})`;
    pCtx.fill();
    pCtx.shadowBlur = 0;
  }
  // Ambient floating particles in message/galaxy phase
  if ((phase === 'messages' || phase === 'galaxy') && Math.random() < 0.12) {
    const x = Math.random() * pCanvas.width;
    const y = Math.random() * pCanvas.height;
    const hue = [270, 300, 210][Math.floor(Math.random() * 3)];
    particles.push({
      x, y, vx: (Math.random()-0.5)*0.5, vy: -(0.2+Math.random()*0.6),
      life: 0.8 + Math.random() * 0.2,
      decay: 0.002 + Math.random() * 0.004,
      size: 0.5 + Math.random() * 1.5,
      hue, sat: 70 + Math.random() * 30, grav: -0.002
    });
  }
}

// ─────────────────────────────────────────────
// FLASH & EXPLOSION
// ─────────────────────────────────────────────
const flashEl = document.getElementById('flash');

function triggerExplosion() {
  phase = 'exploding';
  // Big particle burst
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  spawnParticles(cx, cy, 300, true);

  gsap.to(flashEl, { opacity: 1, duration: 0.25, ease: 'power2.in', onComplete: () => {
    gsap.to(flashEl, { opacity: 0, duration: 1.5, ease: 'power2.out', onComplete: () => {
      revealNewUniverse();
    }});
  }});
}

function revealNewUniverse() {
  phase = 'messages';
  travelActive = false;
  travelSpeed = 0;
  // Fade in nebulae
  gsap.to({ v: 0 }, { v: 1, duration: 3, ease: 'power2.out', onUpdate: function() { nebulaAlpha = this.targets()[0].v; }});

  document.getElementById('particle-canvas').style.opacity = 1;
  pCanvas.style.transition = 'opacity 2s ease';

  // Show first message after a moment
  setTimeout(() => {
    showNextMessage();
  }, 1500);
}

// ─────────────────────────────────────────────
// MESSAGES
// ─────────────────────────────────────────────
const msgs = [document.getElementById('msg1'), document.getElementById('msg2'), document.getElementById('msg3')];
let currentMsg = -1;

function showNextMessage() {
  if (currentMsg >= 0 && msgs[currentMsg]) {
    const old = msgs[currentMsg];
    gsap.to(old, { opacity: 0, y: -20, duration: 1, ease: 'power2.in', onComplete: () => old.classList.remove('active') });
  }
  currentMsg++;

  if (currentMsg >= msgs.length) {
    // All messages done → show galaxy
    setTimeout(() => { launchGalaxy(); }, 800);
    return;
  }

  const msg = msgs[currentMsg];
  msg.classList.add('active');
  // Spawn particles around center
  setTimeout(() => {
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    spawnParticles(cx, cy, 60, false);
  }, 300);

  canClick = true;
  const tapCta = document.getElementById('tap-cta');
  tapCta.style.opacity = '1';
  if (currentMsg === msgs.length - 1) {
    tapCta.textContent = 'toca para explorar el universo';
    canClick = true;
  } else {
    tapCta.textContent = 'toca para continuar';
  }
}

// ─────────────────────────────────────────────
// THREE.JS GALAXY
// ─────────────────────────────────────────────
let renderer, scene, camera, galaxyMesh, galaxyGroup;
let isDragging = false, lastX = 0, lastY = 0;
let rotVelX = 0, rotVelY = 0;
let specialStars = [];
let starMessages = [
  "Gracias por cuidarme.",
  "Eres mi lugar seguro.",
  "Tu amor ilumina mi universo.",
  "Siempre serás mi estrella favorita.",
  "Te quiero hasta las estrellas y más allá.",
  "Mi primer hogar fuiste tú."
];

function launchGalaxy() {
  phase = 'galaxy';
  canClick = false;
  document.getElementById('tap-cta').style.opacity = '0';

  // Fade out message layer
  document.getElementById('ui').style.opacity = '0';
  document.getElementById('ui').style.transition = 'opacity 1.5s ease';

  setTimeout(() => {
    document.getElementById('ui').style.display = 'none';
    buildThreeGalaxy();
  }, 1600);
}

function buildThreeGalaxy() {
  const gc = document.getElementById('galaxy-canvas');
  renderer = new THREE.WebGLRenderer({ canvas: gc, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 28, 55);
  camera.lookAt(0, 0, 0);

  galaxyGroup = new THREE.Group();
  scene.add(galaxyGroup);

  // ── GALAXY PARTICLES ──
  const count = 28000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  const arms = 5;
  const spin = 1.6;
  const radius = 22;
  const randomness = 0.55;
  const randomPow = 2.5;

  const innerColor = new THREE.Color('#a78bfa');
  const outerColor = new THREE.Color('#1e3a5f');
  const armColor = new THREE.Color('#f9a8d4');

  for (let i = 0; i < count; i++) {
    const r = Math.random() * radius;
    const armAngle = ((i % arms) / arms) * Math.PI * 2;
    const spinAngle = r * spin;
    const branchAngle = armAngle + spinAngle;

    const rx = (Math.pow(Math.random(), randomPow) * (Math.random() < 0.5 ? 1 : -1) * randomness * r);
    const ry = (Math.pow(Math.random(), randomPow) * (Math.random() < 0.5 ? 1 : -1) * randomness * r * 0.3);
    const rz = (Math.pow(Math.random(), randomPow) * (Math.random() < 0.5 ? 1 : -1) * randomness * r);

    positions[i*3]   = Math.cos(branchAngle) * r + rx;
    positions[i*3+1] = ry;
    positions[i*3+2] = Math.sin(branchAngle) * r + rz;

    const t = r / radius;
    const c = new THREE.Color();
    c.lerpColors(innerColor, outerColor, t);
    if (Math.random() < 0.2) c.lerp(armColor, 0.4);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
    sizes[i] = Math.random() * 2.5 + 0.5;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float size;
      varying vec3 vColor;
      uniform float uTime;
      uniform float uPixelRatio;
      void main() {
        vColor = color;
        vec3 pos = position;
        pos.y += sin(uTime * 0.3 + pos.x * 0.5) * 0.03;
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * uPixelRatio * (30.0 / -mvPos.z);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float alpha = 1.0 - smoothstep(0.0, 0.5, d);
        alpha *= 1.2;
        gl_FragColor = vec4(vColor * 1.3, alpha);
      }
    `,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  galaxyMesh = new THREE.Points(geo, mat);
  galaxyGroup.add(galaxyMesh);

  // ── CORE GLOW ──
  const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xc4b5fd, transparent: true, opacity: 0.6 });
  const core = new THREE.Mesh(coreGeo, coreMat);
  galaxyGroup.add(core);

  // Glow corona
  const coronaGeo = new THREE.SphereGeometry(2.5, 32, 32);
  const coronaMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(0xa78bfa) } },
    vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vNormal; uniform vec3 uColor; void main() { float d = 1.0 - dot(vNormal, vec3(0,0,1)); float alpha = pow(d, 2.5) * 0.8; gl_FragColor = vec4(uColor, alpha); }`,
    transparent: true, depthWrite: false, side: THREE.FrontSide, blending: THREE.AdditiveBlending
  });
  galaxyGroup.add(new THREE.Mesh(coronaGeo, coronaMat));

  // ── SPECIAL STARS ──
  starMessages.forEach((msg, i) => {
    const angle = (i / starMessages.length) * Math.PI * 2;
    const dist = 15 + Math.random() * 8;
    const sGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const sMat = new THREE.MeshBasicMaterial({ color: 0xfce7f3 });
    const star = new THREE.Mesh(sGeo, sMat);
    star.position.set(Math.cos(angle)*dist, (Math.random()-0.5)*4, Math.sin(angle)*dist);
    star.userData = { msg, index: i, baseY: star.position.y };
    // Glow ring
    const rGeo = new THREE.RingGeometry(0.5, 0.7, 32);
    const rMat = new THREE.MeshBasicMaterial({ color: 0xf9a8d4, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
    star.add(new THREE.Mesh(rGeo, rMat));
    galaxyGroup.add(star);
    specialStars.push(star);
  });

  // ── DUST BELT ──
  const dustCount = 5000;
  const dPos = new Float32Array(dustCount * 3);
  const dCol = new Float32Array(dustCount * 3);
  for (let i = 0; i < dustCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * 20;
    dPos[i*3] = Math.cos(angle)*r + (Math.random()-0.5)*3;
    dPos[i*3+1] = (Math.random()-0.5)*1.5;
    dPos[i*3+2] = Math.sin(angle)*r + (Math.random()-0.5)*3;
    const t = Math.random();
    dCol[i*3] = 0.4 + t*0.3;
    dCol[i*3+1] = 0.2 + t*0.2;
    dCol[i*3+2] = 0.6 + t*0.3;
  }
  const dGeo = new THREE.BufferGeometry();
  dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
  dGeo.setAttribute('color', new THREE.BufferAttribute(dCol, 3));
  const dMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  galaxyGroup.add(new THREE.Points(dGeo, dMat));

  // Show galaxy
  gc.style.opacity = '1';
  document.getElementById('galaxy-ui').style.opacity = '1';
  buildPhotoFrames();
  buildConstellationPhrases();
  setupGalaxyInteraction();
  galaxyReady = true;

  // Animate camera in
  gsap.from(camera.position, { z: 120, y: 60, duration: 4, ease: 'power3.out' });
}
function buildPhotoFrames() {
  const fotos = [
    'img/foto1.jpeg',
    'img/foto2.jpeg',
    'img/foto3.jpeg'
  ];
  const posiciones = [
    { top: '35%', left: '5%' },
    { top: '60%', right: '5%' },
    { top: '15%', right: '8%' }
  ];
  const gUI = document.getElementById('galaxy-ui');

  fotos.forEach((src, i) => {
    const frame = document.createElement('div');
    frame.style.cssText = `
      position: absolute;
      ${Object.entries(posiciones[i]).map(([k,v]) => `${k}:${v}`).join(';')};
      width: clamp(80px, 12vw, 140px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(167,139,250,0.4);
      box-shadow: 0 0 20px rgba(167,139,250,0.3), 0 0 40px rgba(236,72,153,0.15);
      overflow: hidden;
      opacity: 0.75;
      animation: float-phrase ${6 + i}s ease-in-out infinite;
      --rot: ${(Math.random()-0.5)*6}deg;
    `;
    const img = document.createElement('img');
    img.src = src;
    img.style.cssText = 'width:100%; height:100%; object-fit:cover; filter: brightness(0.9) saturate(0.85);';
    frame.appendChild(img);
    gUI.appendChild(frame);
  });
}
function buildConstellationPhrases() {
  const phrases = [
    "Gracias por cuidarme.",
    "Eres mi lugar seguro.",
    "Tu amor ilumina mi universo.",
    "Siempre serás mi estrella favorita.",
    "Te quiero hasta las estrellas.",
    "Mi primer hogar fuiste tú."
  ];
  const gUI = document.getElementById('galaxy-ui');
  const positions = [
    {top:'12%',left:'5%',rot:'-3deg'},{top:'20%',right:'6%',rot:'4deg'},
    {top:'72%',left:'8%',rot:'2deg'},{top:'80%',right:'5%',rot:'-5deg'},
    {top:'45%',left:'3%',rot:'6deg'},{top:'50%',right:'4%',rot:'-2deg'}
  ];
  phrases.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'constellation-phrase';
    el.textContent = p;
    el.style.setProperty('--rot', positions[i].rot);
    Object.assign(el.style, positions[i]);
    el.style.animationDelay = (i * 1.3) + 's';
    gUI.appendChild(el);
  });
}

// ── GALAXY INTERACTION ──
function setupGalaxyInteraction() {
  const gc = document.getElementById('galaxy-canvas');
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const tooltip = document.getElementById('star-tooltip');

  let zoomTarget = camera.position.z;
  let touchDist = 0;

  const onDown = (x, y) => { isDragging = true; lastX = x; lastY = y; rotVelX = 0; rotVelY = 0; };
  const onMove = (x, y) => {
    if (!isDragging) return;
    const dx = x - lastX, dy = y - lastY;
    rotVelX = dy * 0.003;
    rotVelY = dx * 0.003;
    galaxyGroup.rotation.x += rotVelX;
    galaxyGroup.rotation.y += rotVelY;
    lastX = x; lastY = y;
  };
  const onUp = () => { isDragging = false; };

  gc.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
  gc.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  gc.addEventListener('mouseup', onUp);

  gc.addEventListener('touchstart', e => {
    if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
    if (e.touches.length === 2) {
      touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
    e.preventDefault();
  }, { passive: false });

  gc.addEventListener('touchmove', e => {
    if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      zoomTarget = Math.max(20, Math.min(80, zoomTarget * (touchDist / d)));
      touchDist = d;
    }
    e.preventDefault();
  }, { passive: false });

  gc.addEventListener('touchend', onUp);
  gc.addEventListener('wheel', e => {
    zoomTarget = Math.max(20, Math.min(80, camera.position.z + e.deltaY * 0.05));
    e.preventDefault();
  }, { passive: false });

  // Star click
  gc.addEventListener('click', e => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(specialStars, true);
    if (intersects.length > 0) {
      let obj = intersects[0].object;
      while (obj && !obj.userData.msg) obj = obj.parent;
      if (obj && obj.userData.msg) {
        tooltip.textContent = obj.userData.msg;
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY - 20) + 'px';
        tooltip.style.opacity = '1';
        spawnParticles(e.clientX, e.clientY, 30, false);
        setTimeout(() => tooltip.style.opacity = '0', 3500);
      }
    }
  });

  // Camera zoom lerp – stored for use in render loop
  window._zoomTarget = () => zoomTarget;
}

// ─────────────────────────────────────────────
// ANIMATION LOOP
// ─────────────────────────────────────────────
let lastTime = 0;
let time = 0;

function animate(ts) {
  requestAnimationFrame(animate);
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  time += dt;

  // 2D bg
  drawBg(dt);

  // Particles
  updateParticles(dt);

  // Travel speed decay
  if (!travelActive && travelSpeed > 0) {
    travelSpeed = Math.max(0, travelSpeed - dt * 0.0002);
  }

  // Three.js galaxy
  if (galaxyReady && renderer) {
    if (!isDragging) {
      galaxyGroup.rotation.y += 0.0008;
      rotVelX *= 0.95;
      rotVelY *= 0.95;
    }

    specialStars.forEach((s, i) => {
      s.position.y = s.userData.baseY + Math.sin(time * 0.001 + i) * 0.3;
      s.children[0].rotation.z += 0.01;
    });

    if (galaxyMesh) galaxyMesh.material.uniforms.uTime.value = time * 0.001;

    // Zoom lerp
    if (window._zoomTarget) {
      camera.position.z += (window._zoomTarget() - camera.position.z) * 0.05;
    }

    renderer.render(scene, camera);
  }
}

// ─────────────────────────────────────────────
// INTRO SEQUENCE
// ─────────────────────────────────────────────
function startIntro() {
  setTimeout(() => {
    document.getElementById('phase-intro').classList.add('visible');
    setTimeout(() => { canClick = true; }, 2000);
  }, 1500);
}

// ─────────────────────────────────────────────
// CLICK / TAP HANDLER
// ─────────────────────────────────────────────
function handleInteraction(e) {
  const x = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth/2;
  const y = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight/2;

  // Spawn small burst on any click in early phases
  if (phase !== 'galaxy') spawnParticles(x, y, 20, false);

  if (!canClick) return;
  canClick = false;

  if (phase === 'intro') {
    // Start travel
    phase = 'traveling';
    document.getElementById('phase-intro').style.transition = 'opacity 1.5s ease';
    document.getElementById('phase-intro').style.opacity = '0';

    travelActive = true;
    gsap.to({ s: 0 }, { s: 18, duration: 3.5, ease: 'power2.in', onUpdate: function() { travelSpeed = this.targets()[0].s; }});

    // After 3s, launch light beam
    setTimeout(() => {
      travelActive = false;
      lightBeam = { progress: 0 };
    }, 3200);

  } else if (phase === 'messages') {
    showNextMessage();
    document.getElementById('tap-cta').style.opacity = '0';
  }
}

document.addEventListener('click', handleInteraction);
document.addEventListener('touchstart', e => {
  if (phase !== 'galaxy') handleInteraction(e);
}, { passive: false });

// ─────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  resizeBg(); resizeP();
  if (renderer) {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
});

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
resizeBg(); resizeP();
initStars();
startIntro();
requestAnimationFrame(animate);
</script>
